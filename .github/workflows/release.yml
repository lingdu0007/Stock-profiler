name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected release tag
        required: true
        type: string

jobs:
  verify-release-candidate:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      image: ${{ steps.identity.outputs.image }}
      image_repository: ${{ steps.identity.outputs.image_repository }}
      source_date_epoch: ${{ steps.identity.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          EXPECTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$EXPECTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          git check-ref-format --allow-onelevel "refs/tags/$EXPECTED_TAG"
          git fetch --no-tags origin "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
          git cat-file -e "refs/tags/$EXPECTED_TAG^{tag}"
          commit="$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")"
          git merge-base --is-ancestor "$commit" origin/main
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "image=${image_repository}:$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$commit")" >> "$GITHUB_OUTPUT"
      - name: Verify complete CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          completed_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$RELEASE_COMMIT" --status success --json databaseId --jq 'length')"
          test "$completed_runs" -gt 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
        with:
          version: "0.11.6"
      - name: Check out the verified release commit
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: git checkout --detach "$RELEASE_COMMIT"
      - run: uv sync --locked --extra dev --python 3.11
      - name: Verify tag version
        env:
          EXPECTED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          package_version="$(uv run python -c 'from stock_profiler.foundation.versioning import APPLICATION_VERSION; print(APPLICATION_VERSION)')"
          test "v${package_version}" = "$EXPECTED_TAG"
          test "$package_version" != "0.1.0.dev0"

  release:
    name: Controlled release build
    needs: verify-release-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.verify-release-candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174
        with:
          version: "0.11.6"
      - run: uv sync --locked --extra dev --python 3.11
      - run: corepack enable
      - run: corepack pnpm@10.17.1 --dir web install --frozen-lockfile
      - run: make repo-guard license-check api-client-check
      - name: Scan complete history with repository role guard
        run: uv run python scripts/repository_guard.py --history
      - name: Scan complete history with fixed Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp
          /tmp/gitleaks detect --source . --redact --no-banner --log-opts="--all"
      - name: Build controlled release artifacts
        env:
          SOURCE_SHA: ${{ needs.verify-release-candidate.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.verify-release-candidate.outputs.source_date_epoch }}
        run: make artifacts
      - name: Build controlled release container
        env:
          RELEASE_COMMIT: ${{ needs.verify-release-candidate.outputs.commit }}
          RELEASE_IMAGE: ${{ needs.verify-release-candidate.outputs.image }}
          SOURCE_DATE_EPOCH: ${{ needs.verify-release-candidate.outputs.source_date_epoch }}
        run: |
          docker build \
            --build-arg SOURCE_SHA="$RELEASE_COMMIT" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --tag "$RELEASE_IMAGE" \
            .
      - name: Archive the controlled container image
        env:
          IMAGE: ${{ needs.verify-release-candidate.outputs.image }}
        run: |
          docker save "$IMAGE" --output dist/stock-profiler-image.tar
          cd dist && sha256sum stock-profiler-image.tar >> SHA256SUMS
      - name: Attest controlled build artifacts before publication
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/**
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push controlled release container
        env:
          RELEASE_IMAGE: ${{ needs.verify-release-candidate.outputs.image }}
        run: docker push "$RELEASE_IMAGE"
      - name: Record immutable OCI image identity
        id: oci-image
        env:
          IMAGE: ${{ needs.verify-release-candidate.outputs.image }}
        run: |
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          case "$digest" in
            ghcr.io/*@sha256:*) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$digest" > dist/stock-profiler-image.oci-digest
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
          cd dist && sha256sum stock-profiler-image.oci-digest >> SHA256SUMS
      - name: Attest immutable OCI container
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ needs.verify-release-candidate.outputs.image_repository }}
          subject-digest: ${{ steps.oci-image.outputs.digest }}
          push-to-registry: true
      - name: Attest final checksum manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/stock-profiler-image.oci-digest
            dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifacts-${{ needs.verify-release-candidate.outputs.tag }}
          path: dist/
          if-no-files-found: error
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release-candidate.outputs.tag }}
        run: |
          web_archive="$(find dist -maxdepth 1 -type f -name 'stock-profiler-web-*.tar.gz' -print -quit)"
          test -n "$web_archive"
          gh release create "$RELEASE_TAG" \
            dist/python/*.whl \
            dist/python/*.tar.gz \
            "$web_archive" \
            dist/stock-profiler.spdx.json \
            dist/version-bundle.json \
            dist/SHA256SUMS \
            dist/stock-profiler-image.tar \
            dist/stock-profiler-image.oci-digest \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
