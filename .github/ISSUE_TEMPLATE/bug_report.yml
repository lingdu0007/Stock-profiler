name: Synthetic reproducible defect
description: Report a software defect that can be reproduced using original synthetic inputs.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, account facts, market data, provider responses, runtime output, or personal information.
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide original synthetic steps and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
