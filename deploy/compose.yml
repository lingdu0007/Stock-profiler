name: stock-profiler

x-backend: &backend
  image: stock-profiler-backend:${STOCK_PROFILER_SOURCE_SHA:?set a complete Git SHA}
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      SOURCE_SHA: ${STOCK_PROFILER_SOURCE_SHA:?set a complete Git SHA}
      SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?set a source epoch}
  environment: &backend-environment
    STOCK_PROFILER_ENVIRONMENT: production
    STOCK_PROFILER_SOURCE_SHA: ${STOCK_PROFILER_SOURCE_SHA:?set a complete Git SHA}
    STOCK_PROFILER_APP_DATABASE_URL: sqlite:////var/lib/stock-profiler/application.sqlite3
    STOCK_PROFILER_M_AGENT_RUN_STORE_PATH: /var/lib/stock-profiler/m-agent-runs.sqlite3
  user: "10001:10001"
  volumes:
    - application-state:/var/lib/stock-profiler
  networks:
    - application
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-api-environment: &api-environment
  <<: *backend-environment
  STOCK_PROFILER_PROCESS_ROLE: api
  STOCK_PROFILER_AUTH_ORIGIN: ${STOCK_PROFILER_AUTH_ORIGIN:?set an HTTPS origin}
  STOCK_PROFILER_AUTH_RP_ID: ${STOCK_PROFILER_AUTH_RP_ID:?set a relying-party ID}

x-api-secrets: &api-secrets
  - api_shared_secret
  - auth_bootstrap_token
  - auth_recovery_token

services:
  api:
    <<: *backend
    environment: *api-environment
    secrets: *api-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "stock_profiler.entrypoints.http.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--no-access-log"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *backend
    environment:
      <<: *backend-environment
      STOCK_PROFILER_PROCESS_ROLE: scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "stock_profiler.entrypoints.scheduler"]
    healthcheck:
      test: ["CMD", "stock-profiler", "process-health", "scheduler"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    environment:
      <<: *backend-environment
      STOCK_PROFILER_PROCESS_ROLE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "stock_profiler.entrypoints.worker"]
    healthcheck:
      test: ["CMD", "stock-profiler", "process-health", "worker"]
      interval: 15s
      timeout: 5s
      retries: 3

  migrate:
    <<: *backend
    environment:
      <<: *backend-environment
      STOCK_PROFILER_PROCESS_ROLE: migrate
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  gateway:
    image: stock-profiler-gateway:${STOCK_PROFILER_SOURCE_SHA:?set a complete Git SHA}
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
      args:
        SOURCE_SHA: ${STOCK_PROFILER_SOURCE_SHA:?set a complete Git SHA}
        SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH:?set a source epoch}
    depends_on:
      api:
        condition: service_healthy
    environment:
      STOCK_PROFILER_GATEWAY_HOSTNAME: ${STOCK_PROFILER_GATEWAY_HOSTNAME:?set a stable private HTTPS hostname}
      STOCK_PROFILER_GATEWAY_BIND_ADDRESS: ${STOCK_PROFILER_GATEWAY_BIND_ADDRESS:?set a permitted private IPv4 bind address}
      STOCK_PROFILER_AUTH_ORIGIN: ${STOCK_PROFILER_AUTH_ORIGIN:?set an HTTPS origin}
      STOCK_PROFILER_AUTH_RP_ID: ${STOCK_PROFILER_AUTH_RP_ID:?set a relying-party ID}
    extra_hosts:
      - "${STOCK_PROFILER_GATEWAY_HOSTNAME}:127.0.0.1"
    secrets:
      - gateway_tls_certificate
      - gateway_tls_private_key
    ports:
      - "${STOCK_PROFILER_GATEWAY_BIND_ADDRESS:?set a private VPN bind address}:443:8443"
    networks:
      - edge
      - application
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:2019/config/"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

secrets:
  api_shared_secret:
    file: ${STOCK_PROFILER_API_SHARED_SECRET_FILE:?set an absolute path outside the repository}
  auth_bootstrap_token:
    file: ${STOCK_PROFILER_AUTH_BOOTSTRAP_TOKEN_FILE:?set an absolute path outside the repository}
  auth_recovery_token:
    file: ${STOCK_PROFILER_AUTH_RECOVERY_TOKEN_FILE:?set an absolute path outside the repository}
  gateway_tls_certificate:
    file: ${STOCK_PROFILER_GATEWAY_TLS_CERTIFICATE_FILE:?set an absolute path outside the repository}
  gateway_tls_private_key:
    file: ${STOCK_PROFILER_GATEWAY_TLS_PRIVATE_KEY_FILE:?set an absolute path outside the repository}

volumes:
  application-state:

networks:
  edge:
  application:
    internal: true
